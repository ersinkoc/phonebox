name: PhoneBox

options:
  bundleIdPrefix: net.oxog.phonebox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PhoneBoxKit:
    path: PhoneBoxKit

targets:
  PhoneBox:
    type: application
    platform: iOS
    sources:
      - path: PhoneBox
        excludes:
          - "Resources/PanelShim.js"
      - path: PhoneBox/Resources/PanelShim.js
        buildPhase: resources
    dependencies:
      - package: PhoneBoxKit
        product: PhoneBoxKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PhoneBox
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: PhoneBox scans the pairing QR code that your desktop agent shows.
        NSLocalNetworkUsageDescription: PhoneBox connects to your paired computer on the local network or Tailscale.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxog.phonebox.ios
        PRODUCT_NAME: PhoneBox
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # The panel is copied from the Android app's assets, outside this project directory.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Copy the PhoneBox web panel
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          panel_src="${SRCROOT}/../../android/app/src/main/assets/www"
          resources_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -f "${panel_src}/index.html" ]; then
            echo "error: the PhoneBox panel is missing at ${panel_src}" >&2
            exit 1
          fi
          mkdir -p "${resources_dir}/www"
          /usr/bin/rsync -a --delete --exclude '.DS_Store' "${panel_src}/" "${resources_dir}/www/"

schemes:
  PhoneBox:
    build:
      targets:
        PhoneBox: all
    run:
      config: Debug
    archive:
      config: Release
