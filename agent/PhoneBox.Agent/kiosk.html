<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="referrer" content="no-referrer">
<title>PhoneBox kiosk</title>
<!--
  Web kiosk for old browsers (Android 4.4 WebView, old iPads, Fully Kiosk Browser). Deliberately ES5 only:
  no modules, arrow functions, template literals, fetch, Promises, let/const or CSS grid. See Kiosk.cs.
-->
<style>
* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #e8eaf0;
  font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: rgba(0,0,0,0); }
::-webkit-scrollbar { width: 0; height: 0; }
#app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 10px; }
.bar { position: relative; height: 44px; line-height: 44px; padding: 0 6px; }
.bar .host { font-size: 18px; font-weight: bold; }
.bar .dot { display: inline-block; width: 10px; height: 10px; border-radius: 5px; background: #ef4444; margin-right: 8px; vertical-align: middle; }
.bar .dot.on { background: #22c55e; }
.bar .clock { position: absolute; right: 6px; top: 0; font-size: 26px; font-weight: 300; }
.card { display: inline-block; vertical-align: top; width: 100%; background: #161a22; border-radius: 12px; padding: 12px; margin: 0 0 10px; }
.title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8b93a7; margin-bottom: 8px; }
.cols { font-size: 0; }
.cols > .card { font-size: 16px; }
@media (min-width: 700px) { .cols > .card { width: 49%; margin-right: 2%; } .cols > .card:nth-child(2n) { margin-right: 0; } }
.stat { display: inline-block; width: 33%; vertical-align: top; }
.stat b { display: block; font-size: 26px; font-weight: 300; }
.stat small { color: #8b93a7; font-size: 12px; }
.meter { height: 4px; background: #262c38; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.meter i { display: block; height: 4px; background: #3b82f6; width: 0; }
.np { position: relative; min-height: 72px; padding-left: 84px; }
.np.noart { padding-left: 0; min-height: 0; }
.np.noart img { display: none; }
.stat b.small { font-size: 20px; line-height: 31px; white-space: nowrap; }
.np img { position: absolute; left: 0; top: 0; width: 72px; height: 72px; border-radius: 8px; background: #262c38; }
.np .t { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .a { color: #8b93a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btns { margin-top: 10px; font-size: 0; }
.btn { display: inline-block; font-size: 20px; min-width: 52px; height: 44px; line-height: 44px; text-align: center; margin: 0 6px 6px 0;
  padding: 0 8px; border-radius: 10px; background: #262c38; color: #e8eaf0; border: 0; cursor: pointer; }
.btn:active, .key:active { opacity: .6; }
.vol { display: inline-block; font-size: 14px; color: #8b93a7; margin-left: 4px; vertical-align: top; line-height: 44px; }
.keys { font-size: 0; }
.key { display: inline-block; vertical-align: top; width: 23.5%; margin: 0 2% 2% 0; padding: 10px 4px; border-radius: 12px; text-align: center;
  font-size: 13px; color: #fff; cursor: pointer; background: #4b5563; border: 3px solid transparent; overflow: hidden; }
.key:nth-child(4n) { margin-right: 0; }
@media (max-width: 420px) { .key { width: 32%; } .key:nth-child(4n) { margin-right: 2%; } .key:nth-child(3n) { margin-right: 0; } }
.key .i { display: block; font-size: 28px; height: 36px; line-height: 36px; }
.key .l { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key.on { border-color: #fde047; }
.key.busy { opacity: .5; }
.push .row { padding: 6px 0; border-top: 1px solid #262c38; }
.push .row:first-child { border-top: 0; }
.push .k { color: #8b93a7; font-size: 13px; }
.push .v { font-size: 20px; word-wrap: break-word; }
.push .s { color: #8b93a7; font-size: 12px; }
.empty { color: #5b6377; font-size: 14px; }
#toasts { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 10; }
.toast { background: #1f2937; border-left: 6px solid #3b82f6; border-radius: 10px; padding: 12px 14px; margin-top: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.toast.ok { border-left-color: #22c55e; } .toast.warn { border-left-color: #f59e0b; } .toast.error { border-left-color: #ef4444; }
.toast b { display: block; font-size: 17px; }
#offline { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: #b91c1c; color: #fff; text-align: center; padding: 8px; font-size: 14px; }
#offline.show { display: block; }
</style>
</head>
<body>
<div id="offline">PC not connected &middot; reconnecting&hellip;</div>
<div id="app">
  <div class="bar"><span class="dot" id="dot"></span><span class="host" id="host">PhoneBox</span><span class="clock" id="clock">--:--</span></div>
  <div class="cols">
    <div class="card" id="pcCard">
      <div class="title">PC</div>
      <div class="stat"><b id="cpu">&ndash;</b><small>CPU</small><div class="meter"><i id="cpuM"></i></div></div><div class="stat"><b id="ram">&ndash;</b><small id="ramS">RAM</small><div class="meter"><i id="ramM"></i></div></div><div class="stat"><b class="small" id="net">&ndash;</b><small id="netS">Network</small></div>
    </div>
    <div class="card" id="mediaCard">
      <div class="title">Now playing</div>
      <div class="np noart" id="np"><img id="art" alt="" style="visibility:hidden" onerror="this.parentNode.className += ' noart'"><div class="t" id="mTitle">Nothing playing</div><div class="a" id="mArtist"></div></div>
      <div class="btns">
        <button class="btn" data-media="prev">&#9198;</button><button class="btn" data-media="playpause" id="mPlay">&#9199;</button><button class="btn" data-media="next">&#9197;</button><button class="btn" data-vol="down">&minus;</button><button class="btn" data-vol="up">+</button><button class="btn" data-vol="mute" id="mMute">&#128263;</button><span class="vol" id="vol"></span>
      </div>
    </div>
  </div>
  <div class="card"><div class="title">Keys</div><div class="keys" id="keys"><div class="empty">No keys yet: add them in the agent's settings.</div></div></div>
  <div class="card push"><div class="title">Pushed values</div><div id="push"><div class="empty">Nothing pushed yet (POST /api/push/&lt;key&gt;).</div></div></div>
</div>
<div id="toasts"></div>
<script>
(function () {
  'use strict';
  var m = /[?&]token=([^&#]*)/.exec(location.search);
  var TOKEN = m ? m[1] : '';
  var BASE = '/kiosk/api/';
  var lastSeq = null, lastData = 0, es = null, pollTimer = null, retryMs = 1000, keysSig = '', artId = -1;

  function $(id) { return document.getElementById(id); }
  function url(path) { return BASE + path + (path.indexOf('?') < 0 ? '?' : '&') + 'token=' + TOKEN; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function setClass(el, name, on) {
    var c = ' ' + el.className + ' ', has = c.indexOf(' ' + name + ' ') >= 0;
    if (on && !has) el.className = (el.className + ' ' + name).replace(/^\s+/, '');
    if (!on && has) el.className = c.replace(' ' + name + ' ', ' ').replace(/^\s+|\s+$/g, '');
  }
  function req(method, path, done) {
    var x = new XMLHttpRequest();
    x.open(method, url(path), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var data = null;
      try { data = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) { data = null; }
      if (done) done(x.status >= 200 && x.status < 300, data, x.status);
    };
    x.send(method === 'POST' ? '' : null);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function rate(bps) {
    if (bps == null) return '–';
    var b = bps * 8;
    if (b >= 1e9) return (b / 1e9).toFixed(1) + ' Gb/s';
    if (b >= 1e6) return (b / 1e6).toFixed(1) + ' Mb/s';
    if (b >= 1e3) return Math.round(b / 1e3) + ' kb/s';
    return Math.round(b) + ' b/s';
  }

  function online(on) {
    setClass($('dot'), 'on', on);
    setClass($('offline'), 'show', !on);
  }

  // ------------------------------------------------------------ rendering
  function renderPc(pc) {
    if (!pc) return;
    var cpu = pc.cpu == null ? null : Math.round(pc.cpu);
    $('cpu').innerHTML = cpu == null ? '&ndash;' : cpu + '%';
    $('cpuM').style.width = (cpu || 0) + '%';
    var ramPct = pc.ramTotalGb ? Math.round(pc.ramUsedGb / pc.ramTotalGb * 100) : 0;
    $('ram').innerHTML = ramPct + '%';
    $('ramS').innerHTML = 'RAM ' + (pc.ramUsedGb || 0).toFixed(1) + ' / ' + Math.round(pc.ramTotalGb || 0) + ' GB';
    $('ramM').style.width = ramPct + '%';
    $('net').innerHTML = '&darr; ' + rate(pc.netDownBps);
    $('netS').innerHTML = '&uarr; ' + rate(pc.netUpBps);
  }

  function renderMedia(media, audio) {
    if (media && media.title) {
      $('mTitle').innerHTML = esc(media.title);
      $('mArtist').innerHTML = esc([media.artist, media.app].filter(function (s) { return s; }).join(' · '));
      $('mPlay').innerHTML = media.playing ? '&#9208;' : '&#9654;';
      if (media.artId !== artId) {
        artId = media.artId;
        $('art').style.visibility = 'visible';
        setClass($('np'), 'noart', !media.artId);
        if (media.artId) $('art').src = url('art?id=' + media.artId);
      }
    } else {
      $('mTitle').innerHTML = 'Nothing playing';
      $('mArtist').innerHTML = '';
      $('mPlay').innerHTML = '&#9199;';
      setClass($('np'), 'noart', true);
      artId = -1;
    }
    $('vol').innerHTML = audio ? (audio.muted ? 'muted' : audio.volume + '%') : '';
    $('mMute').innerHTML = audio && audio.muted ? '&#128263;' : '&#128264;';
  }

  function renderKeys(list, toggles) {
    list = list || [];
    var sig = JSON.stringify(list);
    var box = $('keys');
    if (sig !== keysSig) {
      keysSig = sig;
      if (!list.length) { box.innerHTML = '<div class="empty">No keys yet: add them in the agent\'s settings.</div>'; return; }
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var k = list[i];
        html += '<div class="key" data-key="' + esc(k.id) + '" style="background:' + esc(/^#[0-9a-fA-F]{3,8}$/.test(k.color) ? k.color : '#4b5563') + '">' +
          '<span class="i">' + esc(k.icon || '•') + '</span><span class="l">' + esc(k.label || k.id) + '</span></div>';
      }
      box.innerHTML = html;
    }
    var nodes = box.getElementsByTagName('div');
    for (var j = 0; j < nodes.length; j++) {
      var id = nodes[j].getAttribute('data-key');
      if (id) setClass(nodes[j], 'on', !!(toggles && toggles[id]));
    }
  }

  // Pushed values: a number or text, {"value","sub","title","unit","icon"}, or a list.
  function pushText(d) {
    if (d == null) return { v: '' };
    if (Object.prototype.toString.call(d) === '[object Array]') return { v: d.slice(0, 8).map(function (x) { return typeof x === 'object' ? (x.text || x.title || x.value || JSON.stringify(x)) : x; }).join(' · ') };
    if (typeof d === 'object') return { v: (d.value == null ? (d.text == null ? JSON.stringify(d) : d.text) : d.value) + (d.unit ? ' ' + d.unit : ''), s: d.sub, t: d.title, i: d.icon };
    return { v: d };
  }
  function renderPush(items) {
    items = items || [];
    if (!items.length) { $('push').innerHTML = '<div class="empty">Nothing pushed yet (POST /api/push/&lt;key&gt;).</div>'; return; }
    items.sort(function (a, b) { return a.key < b.key ? -1 : 1; });
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var p = pushText(items[i].data);
      html += '<div class="row"><div class="k">' + esc((p.i ? p.i + ' ' : '') + (p.t || items[i].key)) + '</div><div class="v">' + esc(p.v) + '</div>' +
        (p.s ? '<div class="s">' + esc(p.s) + '</div>' : '') + '</div>';
    }
    $('push').innerHTML = html;
  }

  function toast(d) {
    d = d || {};
    var el = document.createElement('div');
    el.className = 'toast ' + (/^(ok|warn|error)$/.test(d.level) ? d.level : '');
    el.innerHTML = (d.title ? '<b>' + esc(d.title) + '</b>' : '') + esc(d.text || '');
    var box = $('toasts');
    box.appendChild(el);
    while (box.childNodes.length > 3) box.removeChild(box.firstChild);
    if (d.vibrate !== false && navigator.vibrate) { try { navigator.vibrate(200); } catch (e) { } }
    var secs = d.seconds > 0 ? Math.min(d.seconds, 120) : 6;
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, secs * 1000);
  }

  function onEvent(e) {
    if (!e) return;
    if (e.seq != null) lastSeq = e.seq;
    if (e.kind === 'notify') toast(e.data);
    else if (e.kind === 'reload') location.reload();
  }

  function onState(s) {
    lastData = new Date().getTime();
    online(true);
    if (lastSeq == null) lastSeq = s.evSeq;
    $('host').innerHTML = esc(s.host || 'PhoneBox');
    renderPc(s.pc);
    renderMedia(s.media, s.audio);
    renderKeys(s.shortcuts, s.toggles);
    renderPush(s.push);
    if (s.events) for (var i = 0; i < s.events.length; i++) onEvent(s.events[i]);
  }

  // ------------------------------------------------------------ connection: SSE, polling as a fallback, auto-reconnect
  function retry() {
    online(false);
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 30000);
  }
  function poll() {
    req('GET', 'state' + (lastSeq != null ? '?ev=' + lastSeq : ''), function (ok, data) {
      if (ok && data) { retryMs = 1000; onState(data); pollTimer = setTimeout(poll, 2000); }
      else { pollTimer = null; retry(); }
    });
  }
  function connect() {
    if (!window.EventSource) { poll(); return; }
    if (es) { try { es.close(); } catch (e) { } }
    es = new EventSource(url('stream'));
    es.addEventListener('state', function (m) { retryMs = 1000; try { onState(JSON.parse(m.data)); } catch (e) { } }, false);
    es.addEventListener('event', function (m) { try { onEvent(JSON.parse(m.data)); } catch (e) { } }, false);
    es.onerror = function () {
      if (es) { try { es.close(); } catch (e) { } es = null; }
      // a 403 (wrong key) also lands here: one plain request tells the two apart
      req('GET', 'state', function (ok, data, status) {
        if (status === 403 || status === 404) { $('offline').innerHTML = 'Kiosk key not accepted: open the URL from the agent\'s settings again.'; online(false); return; }
        if (ok && data) onState(data);
        retry();
      });
    };
  }
  // A stream that silently stalls (Wi-Fi sleep on old tablets): reconnect when no data came for 10 s.
  setInterval(function () {
    if (lastData && new Date().getTime() - lastData > 10000 && es) { try { es.close(); } catch (e) { } es = null; lastData = 0; retry(); }
  }, 5000);

  // ------------------------------------------------------------ taps
  function closest(el, attr) {
    while (el && el !== document) { if (el.getAttribute && el.getAttribute(attr) != null) return el; el = el.parentNode; }
    return null;
  }
  document.addEventListener('click', function (ev) {
    var k = closest(ev.target, 'data-key'), b;
    if (k) {
      setClass(k, 'busy', true);
      req('POST', 'run/' + encodeURIComponent(k.getAttribute('data-key')), function (ok, data) {
        setClass(k, 'busy', false);
        if (!ok) toast({ title: 'Key failed', text: data && data.detail ? data.detail : '', level: 'error', vibrate: false });
      });
    } else if ((b = closest(ev.target, 'data-media'))) {
      req('POST', 'media/' + b.getAttribute('data-media'));
    } else if ((b = closest(ev.target, 'data-vol'))) {
      req('POST', 'volume?op=' + b.getAttribute('data-vol'), function (ok, a) { if (ok && a) $('vol').innerHTML = a.muted ? 'muted' : a.volume + '%'; });
    } else {
      // tap anywhere else: go fullscreen where the browser allows it
      var d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen;
      if (fs && !(document.fullscreenElement || document.webkitFullscreenElement)) { try { fs.call(d); } catch (e) { } }
    }
  }, false);

  function clock() {
    var d = new Date();
    $('clock').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  clock();
  setInterval(clock, 5000);
  online(false);
  connect();
})();
</script>
</body>
</html>
