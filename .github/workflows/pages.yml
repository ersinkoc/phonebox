name: pages

# Publishes the live web demo (the real panel and settings page with made-up data) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['android/app/src/main/assets/www/**', 'agent/PhoneBox.Agent/settings.html', 'agent/PhoneBox.Agent/*.json', 'tools/pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the demo
        run: python3 tools/pages/build.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
