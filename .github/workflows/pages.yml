name: pages

# Publishes the live web demo (the real panel and settings page with made-up data) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['android/app/src/main/assets/www/**', 'agent/PhoneBox.Agent/settings.html', 'agent/PhoneBox.Agent/*.json', 'tools/pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the demo
        run: python3 tools/pages/build.py _site
      # Package directly so composite actions cannot introduce unpinned nested dependencies.
      - name: Package the Pages artifact
        run: tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
