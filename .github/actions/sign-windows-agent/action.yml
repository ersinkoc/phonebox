name: Sign the Windows agent
description: >
  Authenticode-signs PhoneBoxAgent.exe through SignPath Foundation and puts the signed file back in place. Only
  PhoneBoxAgent.exe is ours; the other PE file in the publish folder (aspnetcorev2_inprocess.dll) is Microsoft's and
  already signed. The job needs `actions: read`.

inputs:
  exe:
    description: Path of PhoneBoxAgent.exe; it is replaced by the signed file.
    required: true
  signing-policy:
    description: SignPath signing policy slug (release-signing, or test-signing for a trial run).
    required: true
  api-token:
    description: SignPath API token of a user with the Submitter role on that policy.
    required: true
  artifact-suffix:
    description: Runtime identifier to distinguish parallel signing requests.
    default: win-x64
  trusted:
    description: >
      "true" when the certificate must chain to a root Windows trusts (release-signing); the test certificate does not.
    default: "true"

runs:
  using: composite
  steps:
    - name: Upload the unsigned agent for SignPath
      id: unsigned
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unsigned-PhoneBoxAgent-${{ inputs.signing-policy }}-${{ inputs.artifact-suffix }}
        path: ${{ inputs.exe }}
        if-no-files-found: error
        retention-days: 1

    # A release-signing request waits for a manual approval in SignPath: the job waits up to an hour for it.
    - name: Submit the signing request
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ inputs.api-token }}
        organization-id: ed0cbd1a-c4a0-4286-a370-6637aff87f01
        project-slug: phonebox
        signing-policy-slug: ${{ inputs.signing-policy }}
        artifact-configuration-slug: agent-exe
        github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: signpath-signed

    - name: Check the signature and use the signed agent
      shell: pwsh
      env:
        EXE: ${{ inputs.exe }}
        TRUSTED: ${{ inputs.trusted }}
      run: |
        $signed = Join-Path 'signpath-signed' 'PhoneBoxAgent.exe'
        if (-not (Test-Path $signed)) { throw "SignPath returned no PhoneBoxAgent.exe: $(Get-ChildItem -Recurse signpath-signed | Out-String)" }
        $sig = Get-AuthenticodeSignature $signed
        if (-not $sig.SignerCertificate) { throw "PhoneBoxAgent.exe came back unsigned ($($sig.Status))" }
        "Signer: $($sig.SignerCertificate.Subject)"
        "Status: $($sig.Status) $($sig.StatusMessage)"
        "Timestamp: $($sig.TimeStamperCertificate.Subject)"
        if ($env:TRUSTED -eq 'true' -and $sig.Status -ne 'Valid') { throw "the signature is not valid on Windows: $($sig.Status)" }
        Copy-Item $signed $env:EXE -Force
        Remove-Item -Recurse -Force signpath-signed
